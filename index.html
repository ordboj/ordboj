<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordböj</title>
    <meta
      name="description"
      content="Master Swedish verb conjugations with spaced repetition. Fun, mobile-friendly practice for learning Swedish verbs."
    />
    <meta name="author" content="Ordböj" />

    <!--
      CSP meta must stay exactly here, before any script/style tags.
      Do not move it later in <head>: in dev, @vitejs/plugin-react-swc
      injects its preamble script above this point, so the dev-mode policy
      is effectively weaker than production. worker-src blob: is required
      by canvas-confetti, which runs in a Worker built from a Blob URL.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Ordböj" />
    <meta name="twitter:title" content="Ordböj" />
    <meta
      property="og:description"
      content="Master Swedish verb conjugations with spaced repetition. Fun, mobile-friendly practice for learning Swedish verbs."
    />
    <meta
      name="twitter:description"
      content="Master Swedish verb conjugations with spaced repetition. Fun, mobile-friendly practice for learning Swedish verbs."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
