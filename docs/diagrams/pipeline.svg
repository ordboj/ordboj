<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <!-- Hand-drawn. Circle center (700,700), node ring radius 470, 13 stops ~28 degrees apart. -->
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="1400" height="1400" fill="#FFFFFF"/>

  <!-- phase bands (annular sectors) -->
  <path d="M 500 150 A 585 585 0 0 1 1281 771 L 1062 745 A 365 365 0 0 0 575 357 Z"
        fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1276 802 A 585 585 0 1 1 135 549 L 347 605 A 365 365 0 1 0 1059 764 Z"
        fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" opacity="0.6"/>
  <text x="1080" y="213" fill="#1E3A8A" font-size="17" font-weight="bold" text-anchor="middle">1 · idea-pilot — is it worth building?</text>
  <text x="151" y="1043" fill="#334155" font-size="17" font-weight="bold" text-anchor="middle">2 · ticket-pilot — build it</text>

  <!-- ring flow, clockwise -->
  <path d="M 765 235 A 470 470 0 0 1 861 258" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 976 320 A 470 470 0 0 1 1044 379" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 1119 487 A 470 470 0 0 1 1154 578" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 1170 708 A 470 470 0 0 1 1158 806" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 1111 928 A 470 470 0 0 1 1060 1002" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 963 1090 A 470 470 0 0 1 876 1136" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 749 1168 A 470 470 0 0 1 651 1168" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 524 1136 A 470 470 0 0 1 437 1090" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 340 1002 A 470 470 0 0 1 289 928" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 242 806 A 470 470 0 0 1 230 708" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 246 578 A 470 470 0 0 1 277 494" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <path d="M 351 386 A 470 470 0 0 1 424 320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <!-- the green edge closes the loop -->
  <path d="M 508 254 Q 525 208 585 200" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg)"/>
  <text x="500" y="180" fill="#16A34A" font-size="14" font-weight="bold" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">next idea 🔁</text>

  <!-- ring edge labels -->
  <text x="1163" y="522" fill="#64748B" font-size="13" text-anchor="middle">pursue</text>
  <text x="700" y="1196" fill="#64748B" font-size="13" text-anchor="middle">approved</text>
  <text x="467" y="1138" fill="#64748B" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">yes</text>
  <text x="291" y="981" fill="#64748B" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">cleared</text>
  <text x="208" y="760" fill="#64748B" font-size="13" text-anchor="middle">green</text>

  <!-- risky -> ci inner arc, the "no" path -->
  <path d="M 557 1054 A 382 382 0 0 1 360 873" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#m)"/>
  <text x="535" y="1011" fill="#64748B" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">no</text>

  <!-- rework loops, dashed pink -->
  <path d="M 909 230 Q 837 151 736 187" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mp)"/>
  <text x="843" y="120" fill="#DB2777" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">contested,</text>
  <text x="843" y="136" fill="#DB2777" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">one rebuttal round</text>
  <path d="M 859 1189 Q 957 1204 1002 1116" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mp)"/>
  <text x="969" y="1245" fill="#DB2777" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">rejected,</text>
  <text x="969" y="1261" fill="#DB2777" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">max 2 rounds</text>
  <path d="M 327 874 Q 623 943 918 1023" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mp)"/>
  <text x="622" y="978" fill="#DB2777" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">CI fails, remediate</text>

  <!-- reject offshoot -->
  <line x1="1128" y1="401" x2="1152" y2="381" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m)"/>
  <text x="1098" y="352" fill="#64748B" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">reject</text>
  <rect x="1125" y="338" width="120" height="44" rx="20" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="1185" y="365" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">Rejected</text>

  <!-- spokes between the ring and the human -->
  <line x1="700" y1="582" x2="700" y2="316" stroke="#D97706" stroke-width="2" marker-end="url(#ma)"/>
  <text x="700" y="394" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">sends a raw</text>
  <text x="700" y="411" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">idea 💡</text>
  <line x1="1034" y1="466" x2="797" y2="632" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ma)"/>
  <text x="950" y="519" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">asks one precise</text>
  <text x="950" y="536" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">question ❓</text>
  <line x1="427" y1="1003" x2="621" y2="788" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ma)"/>
  <text x="516" y="880" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">parks with one</text>
  <text x="516" y="897" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">question</text>
  <line x1="295" y1="650" x2="583" y2="686" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ma)"/>
  <text x="430" y="703" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">asks for merge</text>
  <text x="430" y="720" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">approval</text>
  <line x1="602" y1="634" x2="362" y2="472" stroke="#D97706" stroke-width="2" marker-end="url(#ma)"/>
  <text x="451" y="525" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">approves in</text>
  <text x="451" y="542" fill="#D97706" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">the chat ✅</text>

  <!-- ring nodes -->
  <!-- blind value review, four separate roles -->
  <rect x="593" y="164" width="214" height="132" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="700" y="186" fill="#1E3A8A" font-size="14" font-weight="bold" text-anchor="middle">blind value review</text>
  <circle cx="648" cy="211" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 634 234 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="648" y="248" fill="#1E3A8A" font-size="10.5" font-weight="bold" text-anchor="middle">srs-engine</text>
  <circle cx="752" cy="211" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 738 234 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="752" y="248" fill="#1E3A8A" font-size="10.5" font-weight="bold" text-anchor="middle">swedish-linguist</text>
  <circle cx="648" cy="257" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 634 280 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="648" y="293" fill="#1E3A8A" font-size="10.5" font-weight="bold" text-anchor="middle">learning-designer</text>
  <circle cx="752" cy="257" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 738 280 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="752" y="293" fill="#1E3A8A" font-size="10.5" font-weight="bold" text-anchor="middle">ui-ux-expert</text>

  <!-- design-critic -->
  <circle cx="920" cy="232" r="9" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <path d="M 906 255 q 0 -13 14 -13 q 14 0 14 13 z" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <rect x="832" y="253" width="176" height="64" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="920" y="279" fill="#831843" font-size="15" font-weight="bold" text-anchor="middle">design-critic</text>
  <text x="920" y="299" fill="#831843" font-size="13" text-anchor="middle">attacks weak arguments</text>

  <!-- verdict -->
  <polygon points="1085,396 1127,430 1085,464 1043,430" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="1085" y="435" fill="#831843" font-size="14" font-weight="bold" text-anchor="middle">Verdict</text>

  <!-- staff-engineer -->
  <circle cx="1167" cy="590" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 1153 613 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <rect x="1079" y="611" width="176" height="64" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="1167" y="637" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">staff-engineer</text>
  <text x="1167" y="657" fill="#1E3A8A" font-size="13" text-anchor="middle">cuts parallel-safe tickets</text>

  <!-- triage -->
  <rect x="1064" y="844" width="150" height="48" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1139" y="873" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">triage the ticket</text>

  <!-- owning agent -->
  <circle cx="1014" cy="996" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 1000 1019 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <rect x="926" y="1017" width="176" height="64" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="1014" y="1043" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">owning agent</text>
  <text x="1014" y="1063" fill="#1E3A8A" font-size="13" text-anchor="middle">implements on a branch</text>

  <!-- reviewer -->
  <circle cx="814" cy="1103" r="9" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <path d="M 800 1126 q 0 -13 14 -13 q 14 0 14 13 z" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <rect x="726" y="1124" width="176" height="64" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="814" y="1150" fill="#831843" font-size="15" font-weight="bold" text-anchor="middle">reviewer</text>
  <text x="814" y="1170" fill="#831843" font-size="13" text-anchor="middle">adversarial review</text>

  <!-- risky change? -->
  <polygon points="586,1121 667,1156 586,1191 505,1156" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="586" y="1161" fill="#831843" font-size="14" font-weight="bold" text-anchor="middle">Risky change?</text>

  <!-- owner-gate -->
  <circle cx="386" cy="996" r="9" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <path d="M 372 1019 q 0 -13 14 -13 q 14 0 14 13 z" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <rect x="288" y="1017" width="196" height="64" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="386" y="1043" fill="#831843" font-size="15" font-weight="bold" text-anchor="middle">owner-gate</text>
  <text x="386" y="1063" fill="#831843" font-size="13" text-anchor="middle">clears or parks risky changes</text>

  <!-- CI watch -->
  <rect x="181" y="844" width="160" height="48" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="261" y="873" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">CI watch + repair</text>

  <!-- ready to merge -->
  <rect x="158" y="619" width="150" height="48" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="233" y="648" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">Ready to merge</text>

  <!-- lead session -->
  <circle cx="310" cy="384" r="9" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 296 407 q 0 -13 14 -13 q 14 0 14 13 z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <rect x="222" y="405" width="176" height="64" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="310" y="431" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">lead session</text>
  <text x="310" y="451" fill="#1E3A8A" font-size="13" text-anchor="middle">merges the PR</text>

  <!-- merged -->
  <rect x="415" y="260" width="130" height="50" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="480" y="291" fill="#14532D" font-size="14" font-weight="bold" text-anchor="middle">Merged 🎉</text>

  <!-- the human, center of the loop -->
  <circle cx="700" cy="700" r="96" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <circle cx="700" cy="666" r="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <path d="M 664 722 q 0 -32 36 -32 q 36 0 36 32 z" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <text x="700" y="748" fill="#78350F" font-size="18" font-weight="bold" text-anchor="middle">Human</text>
  <text x="700" y="770" fill="#78350F" font-size="13" text-anchor="middle">in the loop</text>
</svg>
