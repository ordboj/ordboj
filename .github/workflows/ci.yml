name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is a static SPA with no backend and no secrets. CI only ever needs
# to read the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every check below runs even when an earlier one failed, so a single
      # run reports every problem instead of only the first. A failed step
      # still fails the job. They are skipped when the run is cancelled, and
      # when the install failed, because their output would be meaningless.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Report bundle size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ -d dist ]; then
            ls -l dist/assets
            du -sh dist
          else
            echo 'No dist/ produced: the build step did not succeed.'
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Playwright config only defines a mobile-chrome project (see
      # playwright.config.ts), so CI only needs the Chromium browser.
      # Chromium binaries are pinned to the installed @playwright/test
      # version, so keying the cache on the lockfile hash is enough.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps also installs the OS libraries Chromium needs to run
      # headless on the runner. On a cache hit the browser binary is already
      # present, but the system deps are not cached (they're apt packages,
      # not files under ~/.cache), so this still has to run every time; it's
      # fast when it has nothing new to fetch.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts owns starting the dev server itself (webServer
      # block, port 4173, reuseExistingServer disabled under CI), so no
      # separate server-start step is needed here.
      - name: Run E2E tests
        run: npm run test:e2e

      # Only uploaded on failure: a passing run has no report worth keeping,
      # and skipping the upload on success/cancellation keeps artifact
      # storage down. Short retention because this is a debugging aid, not
      # a long-term artifact.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
