name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is a static SPA with no backend and no secrets. CI only ever needs
# to read the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every check below runs even when an earlier one failed, so a single
      # run reports every problem instead of only the first. A failed step
      # still fails the job. They are skipped when the run is cancelled, and
      # when the install failed, because their output would be meaningless.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Report bundle size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ -d dist ]; then
            ls -l dist/assets
            du -sh dist
          else
            echo 'No dist/ produced: the build step did not succeed.'
          fi
