name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is a static SPA with no backend and no secrets. CI only ever needs
# to read the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No `engines` field or .nvmrc in the repo; 22 is the active Node LTS and
  # matches what's already used locally. Kept in one place so every job
  # (including the Playwright one) stays in lockstep.
  NODE_VERSION: '22'

jobs:
  # Lint, typecheck, unit test and build are independent of each other (none
  # consumes another's output), so they run as separate jobs instead of
  # sequential steps in one job. Each pays its own checkout + npm ci, but
  # that cost is paid in parallel across four runners instead of stacking on
  # one, and a failure in one check no longer blocks the others from
  # reporting (four PR status checks instead of one all-or-nothing job).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          ls -l dist/assets
          du -sh dist

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Playwright config defines two projects, mobile-chrome and
      # csp-prod-build (see playwright.config.ts), both on Pixel 7 (Chromium)
      # emulation and both headless under CI, so only the chromium headless
      # shell is needed (--only-shell), which roughly halves the cache size
      # versus full Chromium. Browser binaries are pinned to the installed
      # @playwright/test version, so keying the cache on the lockfile hash
      # is enough: it invalidates whenever a Dependabot bump changes that
      # version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Skipped entirely on a cache hit: the browser binary is restored from
      # the cache, and the shared libraries Chromium needs are already part
      # of the ubuntu-latest runner image (it ships Chrome). If an image
      # update ever drops one, the test step fails loudly with a missing-lib
      # error and this step gets its --with-deps back. Measured cost of
      # running it unconditionally was 14-16s per run for a no-op apt pass.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      # playwright.config.ts owns starting the dev server itself (webServer
      # block, port 4173, reuseExistingServer disabled under CI), so no
      # separate server-start step is needed here.
      - name: Run E2E tests
        run: npm run test:e2e

      # Only uploaded on failure: a passing run has no report worth keeping,
      # and skipping the upload on success/cancellation keeps artifact
      # storage down. Short retention because this is a debugging aid, not
      # a long-term artifact.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
